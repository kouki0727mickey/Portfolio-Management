<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Lab — 毎時AIアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3A2E5C;--muted:#8a7fa6;--purple:#6B4FD8;--coral:#FF7A9A;--gold:#FFB627;--card:#fff;--bg:#F3ECFF;}
  @media (prefers-color-scheme: dark){:root{--ink:#ECE6FF;--muted:#a79fc4;--card:#241d3d;--bg:#15102a;}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Quicksand','Zen Maru Gothic',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
  a{color:inherit;text-decoration:none}
  .shell{max-width:760px;margin:0 auto;padding:28px 16px 60px}
  .back{font-size:.85rem;color:var(--purple);font-weight:700}
  h1{font-family:'Zen Maru Gothic',sans-serif;font-size:1.8rem;margin:14px 0 6px}
  .lead{color:var(--muted);margin-bottom:22px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(107,79,216,.12);display:flex;flex-direction:column;gap:8px;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .emoji{font-size:2rem}
  .card h2{font-family:'Zen Maru Gothic',sans-serif;font-size:1.05rem}
  .card p{font-size:.88rem;color:var(--muted)}
  .meta{font-size:.75rem;color:var(--purple);font-weight:700;margin-top:auto}
  .empty{color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="../">← ポートフォリオへ戻る</a>
  <h1>🧪 AI Lab</h1>
  <p class="lead">最新のAIニュースをリサーチして、毎時間ひとつ小さなWebアプリを作って公開しています。</p>
  <div class="grid" id="grid"><p class="empty">読み込み中…</p></div>
</div>
<script>
const esc = s => (s??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('apps.json', {cache:'no-store'}).then(r => r.json()).then(apps => {
  apps.sort((a,b) => b.created_at.localeCompare(a.created_at));
  document.getElementById('grid').innerHTML = apps.length ? apps.map(a => `
    <a class="card" href="apps/${encodeURIComponent(a.slug)}/">
      <div class="emoji">${esc(a.emoji)}</div>
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.description)}</p>
      <div class="meta">${new Date(a.created_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}</div>
    </a>`).join('') : '<p class="empty">まだアプリはありません。</p>';
}).catch(() => { document.getElementById('grid').innerHTML = '<p class="empty">読み込みに失敗しました。</p>'; });
</script>
</body>
</html>
